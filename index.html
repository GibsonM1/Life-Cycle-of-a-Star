<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Cycle of a Star: Card Sort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16182b; --muted:#555a70; --paper:#f3f5f9; --card:#ffffff; --line:#c9cede;
  --night:#1b1f3b; --star:#ffd27a;
  --all:#5b4fc4; --sun:#a85f00; --massive:#1f5fa3; --bonus:#0d6e62; --recycle:#4a5568;
  --ok:#1d7a4c; --bad:#b3261e; --focus:#1f5fa3;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:17px;line-height:1.45;color:var(--ink);background:var(--paper)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--ink);background:#fff;border-radius:8px;padding:.45em .9em;font-weight:700}
button.primary{background:var(--night);color:#fff;border-color:var(--night)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top{background:var(--night);color:#fff;padding:14px 20px}
.top-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.top h1{font-size:1.35rem;margin:0}
.ver{font-size:.75rem;font-weight:400;color:#aab0d6;margin-left:6px}
.top label{font-size:.95rem}
.top select{margin-left:6px;border-radius:6px;padding:4px 6px;color:var(--ink)}
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.steps li{font-size:.85rem;border-radius:20px;border:1px solid #8b90b8;color:#cfd3f0}
.steps button{all:unset;display:block;padding:3px 10px;border-radius:20px;cursor:pointer}
.steps button:disabled{cursor:default;opacity:.55}
.steps button:not(:disabled):hover{text-decoration:underline}
.steps button:focus-visible{outline:3px solid var(--star);outline-offset:2px}
.steps li.now{background:var(--star);color:var(--night);border-color:var(--star);font-weight:700}
.steps li.done{background:#2d335c;color:#fff}
.factory{max-width:1240px;margin:14px auto 0;padding:0 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.factory h2{font-size:1rem;margin:0;min-width:11rem}
.ladder{display:grid;grid-template-columns:repeat(14,minmax(34px,1fr));gap:4px;flex:1;min-width:320px}
.el{border:1.5px dashed #8a8fa3;border-radius:5px;text-align:center;padding:2px 0;color:#7a7f94;background:#fff}
.el b{display:block;font-size:1rem;line-height:1.1}
.el small{display:block;font-size:.75rem;line-height:1.1}
.el.made{background:var(--ink);color:#fff;border:1.5px solid var(--ink)}
.el.here{border:1.5px solid var(--ink);color:var(--ink)}
.el.lit{animation:lit .9s ease-out}
@keyframes lit{from{transform:scale(1.25);background:var(--star);color:var(--night)}to{transform:none}}
main{max-width:1240px;margin:0 auto;padding:14px 20px 40px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.panel h2{margin:0 0 6px;font-size:1.3rem}
.lead{margin:0 0 10px;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1100px){.layout{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start}.board{position:sticky;top:8px}}
.board .row{margin-bottom:12px}
.row-label{font-weight:700;font-size:.95rem;margin-bottom:6px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.slot{min-height:96px;border:2px dashed #9aa0b8;border-radius:10px;padding:8px;background:#fafbfd;position:relative}
.slot .cap{font-size:.85rem;color:var(--muted)}
.slot.ready{border-color:var(--focus);background:#eef4fc}
.slot.over{border-style:solid!important;border-color:var(--focus)!important;background:#d3e3f8!important;box-shadow:0 0 0 4px #b8d0f0}
.slot.over .cap::after{content:"  Drop here";font-weight:700;color:var(--focus)}
body.dragging .slot:not(.ok){border-color:var(--focus);background:#eef4fc}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
.ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;background:#fff;border:2px solid var(--night);border-radius:8px;padding:6px 12px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:240px;white-space:nowrap}
.dragsrc{opacity:.35}
.handle{display:flex;gap:8px;align-items:flex-start;touch-action:none;cursor:grab}
.grip{flex:none;color:var(--muted);margin-top:2px}
.remove{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);padding:0;font-size:17px;line-height:1;display:grid;place-items:center;background:#fff}
.remove:hover,.remove:focus-visible{background:var(--bad);color:#fff;border-color:var(--bad)}
.slot.ok{border:2px solid var(--ok);background:#eef8f2}
.slot.ok::after{content:"Correct";position:absolute;top:6px;right:8px;font-size:.8rem;font-weight:700;color:var(--ok)}
.mini{position:relative;margin-top:4px;border-radius:8px;border:1.5px solid var(--ink);padding:6px 38px 6px 8px;background:#fff;touch-action:none;cursor:grab;user-select:none}
.slot.ok .mini{cursor:default;padding-right:8px}
.mini b{display:block}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tray-empty{color:var(--muted)}
.card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;user-select:none;cursor:grab}
.card[data-selected="true"]{border-color:var(--focus);box-shadow:0 0 0 3px #b8d0f0}
.card h3{margin:0;font-size:1.15rem}
.tr{display:block;font-size:.95rem;color:var(--muted)}
.tag{display:inline-block;font-size:.8rem;font-weight:700;color:#fff;border-radius:5px;padding:2px 8px}
.tag.all{background:var(--all)}.tag.sun{background:var(--sun)}.tag.massive,.tag.ns,.tag.bh{background:var(--massive)}.tag.bonus{background:var(--bonus)}.tag.recycle{background:var(--recycle)}
.badge{display:inline-block;margin-left:6px;font-size:.8rem;font-weight:700;background:var(--star);color:var(--night);border-radius:5px;padding:2px 8px}
.art{width:100%;height:auto;max-height:96px}
.artimg{position:relative;aspect-ratio:2/1;border-radius:8px;overflow:hidden;background:#000}
.artimg img{display:block;width:100%;height:100%;object-fit:cover}
.artimg svg{position:absolute;inset:0;width:100%;height:100%;font-family:inherit}
.credit{font-size:.72rem;color:var(--muted);margin:-4px 0 0;line-height:1.2}
.card p{margin:0}
.next{font-style:italic;border-top:1px solid var(--line);padding-top:6px;font-size:.95rem}
.back .ladder{grid-template-columns:repeat(7,1fr);min-width:0}
.back p{font-size:.95rem}
.hintline{background:#fff7e0;border-left:4px solid var(--star);padding:4px 8px;font-size:.92rem}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.card-actions button{font-size:.9rem;padding:.3em .7em}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.msg{min-height:1.4em;font-weight:700}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.feedback{margin:8px 0 0;padding-left:1.2em;color:var(--bad)}
.glossary{margin-top:8px;font-size:.95rem}
.glossary table{border-collapse:collapse}
.glossary td{padding:3px 10px 3px 0;border-bottom:1px solid var(--line)}
label.field{display:block;font-weight:700;margin:10px 0 4px}
input[type=text],textarea{width:100%;max-width:640px;border:2px solid #9aa0b8;border-radius:8px;padding:8px 10px;background:#fff}
textarea{min-height:110px}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em;margin:4px 0 0}
.frame{color:var(--muted);font-size:.95rem;margin:4px 0}
.summary{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:inherit}
.startable{overflow-x:auto;margin-top:8px}
.startable table{border-collapse:collapse;width:100%;min-width:640px}
.startable th,.startable td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;font-size:.95rem}
.startable th{background:var(--paper)}
.startable select{font:inherit;padding:4px;border-radius:6px;border:2px solid #9aa0b8;max-width:100%}
.review-note{margin:0 0 10px;color:var(--muted)}
.mcq{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 18px;background:#fff}
.mcq-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mcq-head h3{margin:0;font-size:1.2rem}
.qnum{flex:none;width:30px;height:30px;border-radius:50%;background:var(--night);color:#fff;display:grid;place-items:center;font-weight:700}
.mcq-body{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:820px){.mcq-body{grid-template-columns:300px minmax(0,1fr)}.mcq-body.nofig{grid-template-columns:minmax(0,1fr)}}
.mcq-fig{margin:0}
.mcq-fig img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--night)}
.mcq-fig figcaption{font-size:.8rem;color:var(--muted);margin-top:4px}
.ph{aspect-ratio:4/3;border:2px dashed #9aa0b8;border-radius:10px;display:grid;place-items:center;text-align:center;padding:12px;color:var(--muted);background:var(--paper);font-size:.95rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0}
.fact{background:var(--paper);border-radius:8px;padding:8px 12px}
.fact dt{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.fact dd{margin:2px 0 0}
.choices{border:0;padding:0;margin:14px 0 0;min-width:0}
.choices legend{font-weight:700;font-size:1.05rem;padding:0;margin-bottom:8px}
.optgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media (min-width:700px){.optgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:8px;cursor:pointer;background:#fff}
.opt:hover{border-color:#9aa0b8}
.opt input{width:20px;height:20px;margin:1px 0 0;flex:none}
.opt.right{border-color:var(--ok);background:#eef8f2}
.opt.wrong{border-color:var(--bad);background:#fdeceb}
.mcq-fb{margin-top:10px;border-left:4px solid var(--ok);padding:4px 12px;background:#f6fbf8}
.mcq-fb.bad{border-left-color:var(--bad);background:#fdf6f5}
.mcq-fb p{margin:4px 0}
.mapwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.mapsvg{display:block;width:100%;min-width:880px;height:auto;font-family:inherit}
.mapnode{cursor:pointer}
.mapnode:hover rect,.mapnode:focus rect{filter:brightness(1.12)}
.mapnode:focus{outline:none}
.mapnode:focus-visible rect{stroke:#ffd27a;stroke-width:4}
.mapkey{display:flex;flex-wrap:wrap;gap:8px 18px;margin:10px 0;font-size:.9rem;color:var(--muted)}
.mapkey span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:16px;height:16px;border-radius:4px}
.sw-b{border:2px dashed #0d6e62;background:#fff}
.sw-d{width:22px;height:0;border-top:2px dashed #6b7085;border-radius:0}
#mapcard{margin-top:10px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.el.lit{animation:none}}
</style>
</head>

  <div class="top-in">
    <h1>Life Cycle of a Star: Card Sort <span class="ver" id="ver"></span></h1>
    <ol class="steps" id="steps" aria-label="Progress"></ol>
    <label>Key words in:

  </div>
</header>
<section class="factory" aria-label="Elements made so far">
  <h2>Elements made so far</h2>
  <div class="ladder" id="factory"></div>
</section>
<main id="app"></main>

20, "y": 434, "lines": ["Star stuff", "recycled"]}], "edges": [{"d": "M170,58 H196"}, {"d": "M350,58 H376"}, {"d": "M530,58 H565 V178 H596"}, {"d": "M565,178 V358 H596"}, {"d": "M750,178 H776"}, {"d": "M930,178 H956"}, {"d": "M750,358 H776"}, {"d": "M930,358 H956"}, {"d": "M1035,386 V446"}, {"d": "M1035,410 H855 V446"}, {"d": "M1035,206 V236", "dashed": true}, {"d": "M1035,506 V541", "dashed": true}, {"d": "M1125,630 H95 V494", "dashed": true, "gray": true}, {"d": "M95,434 V90"}], "lines": ["M930,190 H945 V630", "M1110,268 H1125 V630", "M1110,358 H1125", "M1110,573 H1125"], "labels": [{"x": 20, "y": 20, "t": "All stars", "bold": true, "color": "#5b4fc4"}, {"x": 600, "y": 138, "t": "Stars like our Sun: up to about 8x the Sun's mass", "bold": true, "color": "#a85f00"}, {"x": 600, "y": 318, "t": "Massive stars: more than about 8x the Sun's mass", "bold": true, "color": "#1f5fa3"}, {"x": 548, "y": 268, "t": "Mass decides the path", "bold": true, "color": "#16182b", "anchor": "end"}, {"x": 1042, "y": 438, "t": "8x to 25x", "size": 12}, {"x": 925, "y": 402, "t": "more than about 25x", "size": 12, "anchor": "end"}, {"x": 105, "y": 270, "t": "becomes the next nebula", "size": 13}, {"x": 560, "y": 655, "t": "Released into space: gas and dust carrying new elements", "size": 13, "anchor": "middle"}]}, "mc": [{"id": "mc1", "title": "Vega", "data": [["Mass", "about 2 times the Sun's"], ["In its core", "hydrogen is fusing into helium"], ["Size and brightness", "steady for hundreds of millions of years"]], "ask": "Where is Vega in its life cycle?", "options": ["Protostar", "Main sequence star", "Red giant", "White dwarf"], "correct": "B", "why": "Fusing hydrogen into helium in its core while staying steady is what makes a star main sequence. A protostar has no fusion yet, a red giant's core has run out of hydrogen, and a white dwarf has no fusion at all."}, {"id": "mc2", "title": "The Ring Nebula", "data": [["What it looks like", "a glowing shell of gas, spreading outward"], ["Where it came from", "a star like our Sun"], ["What the gas holds", "hydrogen, helium, carbon, and nitrogen"], ["In the middle", "a tiny, white-hot star"]], "ask": "What is the Ring Nebula?", "options": ["A supernova", "A nebula where new stars are being born", "A red supergiant", "A planetary nebula"], "correct": "D", "why": "Outer layers drifting away from a star like our Sun, carrying new carbon and nitrogen, with a hot core left in the middle: that is a planetary nebula. A star-forming nebula is not spreading away from a dying star, and a supernova comes from a massive star."}, {"id": "mc3", "title": "The object at the center of the Crab Nebula", "data": [["The star it came from", "about 8 to 10 times the Sun's mass"], ["Mass blown into space", "about 85% of that star's mass, when the star died"], ["Mass left in this object", "about 1.4 times the Sun's (estimated)"], ["Size", "about 12 miles wide, the size of a city"], ["Fusion", "none"], ["Other clues", "spins about 30 times a second, inside the cloud left by an explosion people saw in the year 1054"]], "ask": "What is this object?", "options": ["A neutron star", "A white dwarf", "A black hole", "A protostar"], "correct": "A", "why": "The star blew most of its mass into space in a supernova. What was left, more mass than the Sun packed into a city-sized ball, is a neutron star. A white dwarf is about the size of Earth, much bigger than a city. And we could not see a black hole spinning, because light cannot escape it."}], "cards": [{"id": 1, "name": "Nebula", "path": "all", "path_label": "All stars", "made": [], "present": ["H", "He"], "contains": "Mostly hydrogen and helium from the Big Bang, plus a little star stuff from older stars.", "released": "Already in space.", "hint": "Hint: this is the very first card. Stars are born here.", "front": "Stars are born in a nebula, a giant cloud of gas and dust in space. It is mostly hydrogen and helium from the Big Bang. It also holds small amounts of other elements left by older stars. In the Pillars of Creation, new stars are forming right now.", "next": "Gravity pulls the gas and dust together...", "badge": null, "es": "nebulosa", "zh": "星雲", "ar": "سديم", "art": "nebula"}, {"id": 2, "name": "Protostar", "path": "all", "path_label": "All stars", "made": [], "present": ["H", "He"], "contains": "Nothing new is made yet. There is no fusion.", "released": "No.", "hint": "Hint: comes after the cloud of gas and dust. Gravity pulls it into a ball.", "front": "Gravity pulls the gas and dust together. The ball of gas gets smaller and denser. The center gets hotter and hotter. It glows, but it is not a star yet. There is no fusion.", "next": "The core reaches about 10 million K...", "badge": null, "es": "protoestrella", "zh": "原恆星", "ar": "نجم أولي", "art": "protostar"}, {"id": 3, "name": "Main sequence star", "path": "all", "path_label": "All stars", "made": ["He"], "present": ["H"], "contains": "The main sequence: steady hydrogen fusion, about 90% of a star's life. Our Sun is here now.", "released": "No. It stays inside.", "hint": "Hint: the card before shows fusion starting. This one shows it running for billions of years.", "front": "The core reaches about 10 million K. Hydrogen nuclei are positive, so they repel. Now they move fast enough to crash together and fuse into helium. Fusion pushes out, gravity pulls in, and the star stays steady for millions to billions of years. This is the main sequence: about 90% of a star's life.", "next": "The hydrogen in the core runs out. The path depends on the star's mass.", "badge": "Our Sun is here now", "es": "estrella de la secuencia principal", "zh": "主序星", "ar": "نجم في النسق الأساسي", "art": "sun"}, {"id": 4, "name": "Red giant", "path": "sun", "path_label": "Stars like our Sun: up to about 8x the Sun's mass", "made": ["C", "N", "O"], "present": ["H", "He"], "contains": "Helium fuses into carbon and oxygen. Some nitrogen forms too.", "released": "Not yet.", "hint": "Hint: the hydrogen in the core runs low. Comes right after our Sun's stage today.", "front": "The hydrogen in the core runs out. Gravity squeezes the core, so it gets hotter. Now helium fuses into carbon and oxygen. The outer layers swell to about 100 times wider and cool to red. Our Sun will do this in about 5 billion years.", "next": "The outer layers drift away...", "badge": null, "es": "gigante roja", "zh": "紅巨星", "ar": "عملاق أحمر", "art": "redgiant"}, {"id": 5, "name": "Planetary nebula", "path": "sun", "path_label": "Stars like our Sun: up to about 8x the Sun's mass", "made": [], "present": ["H", "He", "C", "N"], "contains": "The outer layers carry hydrogen, helium, and new carbon and nitrogen.", "released": "Yes. The outer layers drift into space.", "hint": "Hint: the red giant's outer layers float away. Comes after the red giant.", "front": "The outer layers drift away into space. They carry hydrogen, helium, and new carbon and nitrogen with them. This glowing shell is called a planetary nebula, but it has nothing to do with planets. Only the hot core is left in the middle.", "next": "Only the core is left...", "badge": null, "es": "nebulosa planetaria", "zh": "行星狀星雲", "ar": "سديم كوكبي", "art": "pn"}, {"id": 6, "name": "White dwarf", "path": "sun", "path_label": "Stars like our Sun: up to about 8x the Sun's mass", "made": [], "present": ["C", "O"], "contains": "A leftover core of carbon and oxygen. No fusion.", "released": "No, it stays locked inside, unless the white dwarf has a close partner star (bonus card).", "hint": "Hint: the leftover core of a star like our Sun. Comes after the outer layers blow away.", "front": "Only the core is left. It is called a white dwarf: white-hot, but only about the size of Earth. There is no fusion. Its carbon and oxygen stay locked inside. It slowly cools for billions of years.", "next": "Most white dwarfs end here. If one has a close partner star, see the bonus card.", "badge": null, "es": "enana blanca", "zh": "白矮星", "ar": "قزم أبيض", "art": "wd"}, {"id": 7, "name": "Red supergiant", "path": "massive", "path_label": "Massive stars: more than about 8x the Sun's mass", "made": ["C", "O", "Ne", "Mg", "Si", "S"], "present": ["H", "He"], "contains": "The core builds heavier and heavier elements in layers.", "released": "Not yet.", "hint": "Hint: a massive star builds layers like an onion. Comes after the main sequence.", "front": "The hydrogen in the core runs out. A massive star's core gets hot enough to fuse heavier and heavier elements: carbon, oxygen, neon, magnesium, silicon, sulfur. Each new fusion stage starts in the hot center. The star ends up with layers like an onion.", "next": "The core fills with iron...", "badge": null, "es": "supergigante roja", "zh": "紅超巨星", "ar": "عملاق أحمر فائق", "art": "onion"}, {"id": 8, "name": "Iron core collapse", "path": "massive", "path_label": "Massive stars: more than about 8x the Sun's mass", "made": ["Ca", "Fe"], "present": ["H", "He", "C", "O", "Ne", "Mg", "Si", "S"], "contains": "Silicon fuses into calcium and then iron. Then fusion stops.", "released": "Not yet.", "hint": "Hint: the core fills with iron. Comes after the onion layers.", "front": "Silicon fuses into heavier elements like calcium, and finally iron. The core fills with iron. Fusing iron uses up energy instead of releasing it. So fusion in the core stops, and nothing pushes out. Gravity wins. The core collapses in less than one second.", "next": "The outer layers crash in and bounce out...", "badge": null, "es": "colapso del núcleo de hierro", "zh": "鐵核心塌縮", "ar": "انهيار اللب الحديدي", "art": "collapse"}, {"id": 9, "name": "Supernova", "path": "massive", "path_label": "Massive stars: more than about 8x the Sun's mass", "made": ["Fe"], "present": ["H", "He", "C", "O", "Ne", "Mg", "Si", "S", "Ca"], "contains": "Makes more iron and a few elements heavier than iron.", "released": "Yes, all of it.", "hint": "Hint: comes right after the iron core collapses.", "front": "The outer layers crash into the collapsed core and bounce out in a giant explosion called a supernova. It blasts oxygen, silicon, sulfur, calcium, and iron into space. For a few weeks it can shine as brightly as billions of Suns.", "next": "What is left in the center depends on the star's mass...", "badge": null, "es": "supernova", "zh": "超新星", "ar": "مستعر أعظم", "art": "supernova"}, {"id": 10, "name": "Neutron star", "path": "ns", "path_label": "Massive stars: about 8x to 25x the Sun's mass", "made": [], "present": [], "contains": "Atoms are crushed into neutrons. No elements are left.", "released": "No, locked inside.", "hint": "Hint: one possible leftover after a supernova.", "front": "If the original star was about 8 to 25 times the Sun's mass, the core becomes a neutron star. It packs about 1.5 times the Sun's mass into a ball about 12 miles wide, the size of a city. Atoms are crushed into neutrons.", "next": "If two neutron stars orbit each other, see the bonus card.", "badge": null, "es": "estrella de neutrones", "zh": "中子星", "ar": "نجم نيوتروني", "art": "ns"}, {"id": 11, "name": "Black hole", "path": "bh", "path_label": "Massive stars: more than about 25x the Sun's mass", "made": [], "present": [], "contains": "Nothing escapes, not even light.", "released": "No. Nothing escapes.", "hint": "Hint: the other possible leftover after a supernova, for the most massive stars.", "front": "If the original star was more than about 25 times the Sun's mass, the core collapses into a black hole. Its gravity is so strong that not even light escapes. We find black holes by the hot, glowing gas swirling around them.", "next": "Only the supernova's debris moves on to the last card.", "badge": null, "es": "agujero negro", "zh": "黑洞", "ar": "ثقب أسود", "art": "bh"}, {"id": 12, "name": "Star stuff recycled", "path": "recycle", "path_label": "Back to the start", "made": [], "present": ["H", "He", "C", "N", "O", "Ne", "Mg", "Si", "S", "Ca", "Fe", "Pt", "Au", "U"], "contains": "Every element released by older stars mixes into new clouds.", "released": "Already in space. It becomes the next nebula.", "hint": "Hint: the last card. Its gas and dust become the first card again.", "front": "Gas and dust blown out by dying stars mix into new clouds. Now the clouds hold carbon, oxygen, iron, and gold. They become new nebulas, stars, and planets. Our solar system, and you, formed this way about 4.5 billion years ago.", "next": "Back to the first card: stars are born in a nebula.", "badge": null, "es": "material estelar reciclado", "zh": "恆星物質再利用", "ar": "إعادة تدوير مادة النجوم", "art": "recycle"}, {"id": 13, "name": "White dwarf explodes", "path": "bonus", "path_label": "Bonus: needs a close partner star", "made": ["Si", "S", "Ca", "Fe"], "present": ["C", "O"], "contains": "Makes much of the universe's iron.", "released": "Yes. Everything blasts into space.", "hint": "Hint: branches off the white dwarf, only if it has a close partner star.", "front": "A white dwarf with a close partner star can pull gas off its partner. When the white dwarf gets too heavy, it explodes. This makes much of the universe's iron. Our Sun has no partner star, so it will never do this.", "next": "Its iron moves on to the last card.", "badge": null, "es": "explota una enana blanca", "zh": "白矮星爆炸", "ar": "انفجار قزم أبيض", "art": "partnerwd"}, {"id": 14, "name": "Neutron stars collide", "path": "bonus", "path_label": "Bonus: needs a close partner star", "made": ["Pt", "Au", "U"], "present": [], "contains": "The crash makes gold, platinum, and uranium.", "released": "Yes. The debris flies into space.", "hint": "Hint: branches off the neutron star, only if two neutron stars orbit each other.", "front": "Two neutron stars that orbit each other slowly spiral together and crash. The crash makes gold, platinum, and uranium. Telescopes saw this happen in 2017. Scientists think this makes most gold, but they are still testing other sources.", "next": "Its gold moves on to the last card.", "badge": null, "es": "chocan dos estrellas de neutrones", "zh": "中子星碰撞", "ar": "تصادم نجمين نيوترونيين", "art": "collide"}], "ladder": [["H", 1], ["He", 2], ["C", 6], ["N", 7], ["O", 8], ["Ne", 10], ["Mg", 12], ["Si", 14], ["S", 16], ["Ca", 20], ["Fe", 26], ["Pt", 78], ["Au", 79], ["U", 92]], "rounds": [{"title": "Round 1: How all stars begin", "intro": "Every star starts this way. Put these 3 cards in order.", "order": [3, 1, 2], "slots": [{"id": "r1a", "row": "All stars", "cap": "1st card", "answer": 1}, {"id": "r1b", "row": "All stars", "cap": "2nd card", "answer": 2}, {"id": "r1c", "row": "All stars", "cap": "3rd card", "answer": 3}], "doneMsg": "Round 1 done. The third card is the main sequence: steady hydrogen fusion, about 90% of a star's life. Hydrogen and helium are in the element factory."}, {"title": "Round 2: End of life for stars like our Sun", "intro": "This is our Sun's path. What happens after the hydrogen in the core runs out?", "order": [6, 4, 5], "slots": [{"id": "r2a", "row": "Stars like our Sun", "cap": "1st card", "answer": 4}, {"id": "r2b", "row": "Stars like our Sun", "cap": "2nd card", "answer": 5}, {"id": "r2c", "row": "Stars like our Sun", "cap": "3rd card", "answer": 6}], "doneMsg": "Round 2 done. Carbon, nitrogen, and oxygen are in the factory."}, {"title": "Round 3: End of life for massive stars (mass more than ~8x our Sun's)", "intro": "A massive star takes a different path. Put 3 cards in a row. Then choose what is left in the center and the last card.", "order": [10, 8, 12, 7, 11, 9], "slots": [{"id": "r3a", "row": "Massive stars", "cap": "1st card", "answer": 7}, {"id": "r3b", "row": "Massive stars", "cap": "2nd card", "answer": 8}, {"id": "r3c", "row": "Massive stars", "cap": "3rd card", "answer": 9}, {"id": "r3d", "row": "What is left in the center?", "cap": "If about 8x to 25x the Sun's mass", "answer": 10}, {"id": "r3e", "row": "What is left in the center?", "cap": "If more than about 25x the Sun's mass", "answer": 11}, {"id": "r3f", "row": "Back to th : "Sol (our Sun)", "short": "Sol", "mass": "1", "see": "Steady star, fusing hydrogen in its core for 4.6 billion years", "answer": ["Main sequence star"]}, {"id": "aldebaran", "name": "Aldebaran", "short": "Aldebaran", "mass": "about 1.2", "see": "Orange-red star, swollen to about 45 times the Sun's width", "answer": ["Red giant"]}, {"id": "betelgeuse", "name": "Betelgeuse", "short": "Betelgeuse", "mass": "about 15 to 20", "see": "Red star, swollen to hundreds of times the Sun's width, fusing helium in its core", "answer": ["Red supergiant"]}, {"id": "siriusB", "name": "Sirius B, the tiny partner of Sirius", "short": "Sirius B", "mass": "about 1", "see": "White-hot but only about the size of Earth. No fusion.", "answer": ["White dwarf"]}], "stageOptions": ["Main sequence star", "Red giant", "Red supergiant", "White dwarf", "Neutron star"], "starsTask": {"label": "Exit ticket: stars you already know", "text": "In Star Discovery, you studied these stars' light. Their light mostly shows what each star was born from, not its stage in life. Use each star's mass and what astronomers see to name its stage in life now. Choose from: main sequence star, red giant, red supergiant, white dwarf, neutron star."}, "msDef": "The long, steady stage when a star fuses hydrogen into helium in its core. It is about 90% of a star's life.", "reading": {"title": "Where Does Gold Come From? NASA Data Has Clues", "source": "NASA, 2025", "url": "https://science.nasa.gov/universe/stars/neutron-stars/magnetars/where-does-gold-come-from-nasa-data-has-clues/"}};

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CARD = Object.fromEntries(DATA.cards.map((c) => [c.id, c]));
const ROUNDS = DATA.rounds;
const KEY = "starsort-v5";
const VERSION = "Oct 10, 2026, update 4";

let state = load() || fresh();
function fresh() {
  return { stage: "start", round: 0, place: {}, locked: {}, checks: [0, 0, 0, 0], hints: 0, hintTier: [0, 0, 0, 0],
    flips: 0, name: "", period: "", iron: "", carbon: "", gold: "", mc: {}, mcChecked: false, started: Date.now(), lit: [] };
}
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

let selected = null;
let shownBack = new Set();
let showHints = false;

function imgArt(kind) {
  const src = DATA.images[kind];
  if (!src) return null;
  const T = (x, y, t, o = {}) => `<text x="${x}" y="${y}" font-size="${o.size || 10.5}" font-weight="700" text-anchor="${o.anchor || "start"}" fill="${o.fill || "#ffffff"}" stroke="#000000" stroke-width="3" stroke-linejoin="round" paint-order="stroke">${t}</text>`;
  const A = (x1, y1, x2, y2, color, w = 2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" stroke-width="${w + 2.4}" stroke-linecap="round" opacity=".55"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}" stroke-linecap="round" marker-end="url(#ah_${color.slice(1)})"/>`;
  const mk = (color) => `<marker id="ah_${color.slice(1)}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="${color}" stroke="#000" stroke-width=".6"/></marker>`;
  const lead = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" stroke-width="3" opacity=".5"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fff" stroke-width="1.3"/><circle cx="${x2}" cy="${y2}" r="2.4" fill="#fff" stroke="#000" stroke-width=".8"/>`;
  const Y = "#fff3a0", B = "#8ec5ff";
  const radial = (cx, cy, r1, r2, angs, color) => angs.map((d) => { const a = d * Math.PI / 180; return A(cx + r1 * Math.cos(a), cy + r1 * Math.sin(a), cx + r2 * Math.cos(a), cy + r2 * Math.sin(a), color); }).join("");
  const O = {
    sun: radial(120, 60, 9, 40, [0, 60, 120, 180, 240, 300], Y) + radial(120, 60, 98, 63, [180, 160, 200, 0, 20, 340], B)
      + `<circle cx="120" cy="60" r="5" fill="#fffbe0" stroke="#000" stroke-width=".6"/>`
      + T(4, 14, "gravity pulls in", { fill: B }) + T(236, 114, "fusion pushes out", { fill: Y, anchor: "end" }),
    nebula: T(4, 113, "giant cloud of gas and dust"),
    pn: radial(118, 57, 40, 58, [210, 330, 30, 150], Y) + lead(160, 104, 120, 58)
      + T(4, 14, "outer layers drift away", { fill: Y }) + T(236, 113, "hot core in the middle", { anchor: "end" }),
    wd: lead(150, 22, 110, 69) + T(236, 18, "white dwarf: Earth-sized", { anchor: "end" }),
    bh: lead(196, 64, 124, 84) + T(236, 60, "black hole", { anchor: "end" }) + T(4, 14, "glowing gas swirls around it"),
    ns: `<circle cx="183" cy="44" r="31" fill="#b9c4ff" fill-opacity=".28" stroke="#dfe5ff" stroke-width="1.6"/>
         <rect x="164.9" y="25.9" width="36.2" height="36.2" fill="none" stroke="#ffd27a" stroke-width="1.6" stroke-dasharray="3 2"/>`
      + T(183, 48, "SF", { fill: "#ffd27a", anchor: "middle" })
      + T(183, 90, "12 miles across", { anchor: "middle", size: 10 }) + T(183, 103, "SF fits inside!", { anchor: "middle", fill: "#ffd27a", size: 10 })
      + T(183, 116, "(SF is 7 miles across)", { anchor: "middle", size: 9.5 }) + T(4, 113, "neutron star"),
  };
  const credit = DATA.imageCredits[kind];
  return `<div class="artimg"><img src="${src}" alt=""><svg viewBox="0 0 240 120" aria-hidden="true"><defs>${mk(Y)}${mk(B)}</defs>${O[kind] || ""}</svg></div>${credit ? `<p class="credit">Image: ${esc(credit)}</p>` : ""}`;
}

function art(kind) {
  const im = imgArt(kind);
  if (im) return im;
  const g = '<svg class="art" viewBox="0 0 240 96" role="img" aria-hidden="true">';
  const T = (x, y, t, a = "middle") => `<text x="${x}" y="${y}" font-size="12" text-anchor="${a}" fill="#16182b">${t}</text>`;
  const arrow = (x1, y1, x2, y2, c = "#16182b") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="2" marker-end="url(#ah)"/>`;
  const defs = '<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16182b"/></marker></defs>';
  const A = {
    nebula: `<ellipse cx="80" cy="48" rx="70" ry="30" fill="#c9c3ee"/><ellipse cx="150" cy="40" rx="60" ry="26" fill="#a99fe3"/><ellipse cx="120" cy="58" rx="50" ry="20" fill="#d8d3f5"/><circle cx="95" cy="44" r="3" fill="#ffd27a"/><circle cx="160" cy="52" r="2.5" fill="#ffd27a"/>${T(120, 92, "giant cloud of gas and dust")}`,
    protostar: `<circle cx="36" cy="44" r="28" fill="none" stroke="#777" stroke-dasharray="4 3"/>${T(36, 48, "cloud")}${arrow(68, 44, 92, 44)}<circle cx="116" cy="44" r="18" fill="#d9d0c4"/>${T(116, 48, "denser")}${arrow(138, 44, 162, 44)}<circle cx="190" cy="44" r="12" fill="#f2a33a"/>${T(190, 90, "hot, no fusion")}`,
    balance: `<circle cx="120" cy="50" r="20" fill="#f2a33a"/>${arrow(40, 50, 94, 50, "#1f5fa3")}${arrow(200, 50, 146, 50, "#1f5fa3")}${arrow(136, 36, 160, 20)}${arrow(104, 36, 80, 20)}${T(120, 14, "fusion pushes out")}${T(56, 70, "gravity in")}${T(184, 70, "gravity in")}${T(120, 92, "balanced: steady star")}`,
    redgiant: `<circle cx="24" cy="48" r="3" fill="#f2a33a"/>${T(24, 66, "Sun now")}<circle cx="140" cy="46" r="40" fill="#e7a08f"/><circle cx="140" cy="46" r="4" fill="#16182b"/>${T(140, 94, "red giant: about 100x wider")}`,
    pn: `<ellipse cx="120" cy="46" rx="62" ry="36" fill="none" stroke="#7fb5c9" stroke-width="10"/><ellipse cx="120" cy="46" rx="44" ry="24" fill="#f3d0e8"/><circle cx="120" cy="46" r="4" fill="#fff" stroke="#16182b"/>${T(120, 94, "glowing shell, hot core in the middle")}`,
    whitedwarf: `<circle cx="70" cy="44" r="8" fill="#dfe8f5" stroke="#16182b"/>${T(70, 68, "white dwarf")}<circle cx="170" cy="44" r="8" fill="#6ea6d8"/>${T(170, 68, "Earth")}${T(120, 92, "about the same size")}`,
    onion: `<circle cx="70" cy="46" r="42" fill="#f4d6a8" stroke="#16182b" stroke-width=".5"/><circle cx="70" cy="46" r="33" fill="#eebd74" stroke="#16182b" stroke-width=".5"/><circle cx="70" cy="46" r="24" fill="#d9925a" stroke="#16182b" stroke-width=".5"/><circle cx="70" cy="46" r="15" fill="#b56b4a" stroke="#16182b" stroke-width=".5"/><circle cx="70" cy="46" r="7" fill="#555"/>${T(130, 18, "H", "start")}${T(130, 33, "He", "start")}${T(130, 48, "C, O", "start")}${T(130, 63, "Si, S", "start")}${T(130, 78, "Fe (center)", "start")}`,
    collapse: `<circle cx="120" cy="46" r="13" fill="#555"/><text x="120" y="50" font-size="12" text-anchor="middle" fill="#fff" font-weight="700">Fe</text>${[0, 45, 90, 135, 180, 225, 270, 315].map((a) => { const r = a * Math.PI / 180; return arrow(120 + 52 * Math.cos(r), 46 + 36 * Math.sin(r), 120 + 22 * Math.cos(r), 46 + 18 * Math.sin(r), "#1f5fa3"); }).join("")}${T(120, 94, "gravity wins: collapse in under 1 second")}`,
    supernova: `<polygon points="120,6 132,34 162,22 146,48 176,62 140,62 140,88 120,68 100,88 100,62 64,62 94,48 78,22 108,34" fill="#ffd27a" stroke="#c8432b" stroke-width="2"/><circle cx="120" cy="48" r="6" fill="#555"/>`,
    neutron: `<rect x="24" y="26" width="64" height="40" fill="#e6e6e6"/>${[0, 1, 2, 3, 4, 5].map((i) => `<rect x="${28 + i * 10}" y="${66 - 14 - (i * 7) % 22}" width="7" height="${14 + (i * 7) % 22}" fill="#777"/>`).join("")}${T(56, 82, "a city")}<circle cx="170" cy="46" r="20" fill="#9fb8d9" stroke="#16182b"/>${T(170, 82, "neutron star")}`,
    blackhole: `<ellipse cx="120" cy="48" rx="64" ry="16" fill="none" stroke="#f2a33a" stroke-width="8"/><circle cx="120" cy="46" r="20" fill="#16182b"/>${T(120, 92, "glowing gas around a black hole")}`,
    recycle: `<ellipse cx="120" cy="48" rx="80" ry="20" fill="#d8d3f5"/><ellipse cx="120" cy="48" rx="50" ry="11" fill="#b8b0ea"/><circle cx="120" cy="48" r="9" fill="#f2a33a"/><circle cx="168" cy="52" r="3" fill="#6ea6d8"/>${T(120, 92, "new star and planets forming")}`,
    partnerwd: `<circle cx="60" cy="44" r="26" fill="#f0c27a"/>${T(60, 86, "partner star")}<circle cx="180" cy="44" r="6" fill="#dfe8f5" stroke="#16182b"/>${T(180, 86, "white dwarf")}${arrow(90, 44, 168, 44)}${T(128, 36, "gas pulled over")}`,
    collide: `<ellipse cx="120" cy="50" rx="56" ry="18" fill="none" stroke="#888" stroke-dasharray="3 3"/><circle cx="88" cy="50" r="9" fill="#9fb8d9" stroke="#16182b"/><circle cx="152" cy="50" r="9" fill="#9fb8d9" stroke="#16182b"/>${T(120, 22, "two neutron stars spiral in")}${T(120, 92, "crash: gold, platinum, uranium")}`,
  };
  return g + defs + (A[kind] || "") + "</svg>";
}

function ladderHTML(c) {
  return '<div class="ladder">' + DATA.ladder.map(([s, z]) => {
    const cls = c.made.includes(s) ? "made" : c.present.includes(s) ? "here" : "";
    const st = cls === "made" ? "made here" : cls === "here" ? "already here" : "not here";
    return `<div class="el ${cls}" aria-label="${s}, ${st}"><small>${z}</small><b>${s}</b></div>`;
  }).join("") + "</div>";
}

function trName(c) {
  const l = $("#lang").value;
  if (!l) return "";
  const dir = l === "ar" ? ' dir="rtl"' : "";
  return `<span class="tr" lang="${l === "zh" ? "zh-Hant" : l}"${dir}>${esc(c[l])}</span>`;
}

function cardHTML(c, roundIdx, review) {
  const back = shownBack.has(c.id);
  const sel = selected === c.id;
  const face = back
    ? `<div class="back"><p><b>Element factory</b> (black = made here)</p>${ladderHTML(c)}<p>${esc(c.contains)}</p><p><b>Released into space?</b> ${esc(c.released)}</p></div>`
    : `<div class="front">${art(c.art)}<p>${esc(c.front)}</p><p class="next">Next: ${esc(c.next)}</p></div>`;
  const hint = showHints ? `<p class="hintline">${esc(c.hint)}</p>` : "";
  return `<article class="card" data-id="${c.id}" tabindex="0" data-selected="${sel}" aria-label="${esc(c.name)} card${sel ? ", selected" : ""}. Press Enter to select, then choose a box.">
    <div class="${review ? "" : "handle"}"${review ? "" : ' title="Drag by the title"'}>${review ? "" : `<svg class="grip" width="14" height="22" viewBox="0 0 14 22" aria-hidden="true"><g fill="currentColor"><circle cx="4" cy="4" r="2"/><circle cx="10" cy="4" r="2"/><circle cx="4" cy="11" r="2"/><circle cx="10" cy="11" r="2"/><circle cx="4" cy="18" r="2"/><circle cx="10" cy="18" r="2"/></g></svg>`}<div><h3>${esc(c.name)}</h3>${trName(c)}<span class="tag ${c.path}">${esc(c.path_label)}</span>${c.badge ? `<span class="badge">${esc(c.badge)}</span>` : ""}</div></div>
    ${face}${hint}
    <div class="card-actions"><button type="button" data-flip="${c.id}">${back ? "Show front" : "Flip card"}</button>
    ${review ? "" : `<button type="button" data-select="${c.id}">${sel ? "Selected" : "Select"}</button>`}</div></article>`;
}

function roundDone(r) { return ROUNDS[r].slots.every((s) => state.locked[s.id]); }
function allDone() { return ROUNDS.every((_, r) => roundDone(r)); }
function renderSteps() {
  const names = ["Start", "Round 1", "Round 2", "Round 3", "Bonus", "Map", "Quick check", "Explain", "Finish"];
  const idx = state.stage === "start" ? 0 : state.stage === "sort" ? state.round + 1 : state.stage === "map" ? 5 : state.stage === "quiz" ? 6 : state.stage === "explain" ? 7 : 8;
  const can = (i) => i === 0 || (!!state.name && (i <= 4 ? (i === 1 || roundDone(i - 2)) : i <= 6 ? allDone() : i === 7 ? allDone() && !!state.mcChecked : !!state.finished));
  $("#steps").innerHTML = names.map((n, i) => `<li class="${i === idx ? "now" : can(i) ? "done" : ""}"><button type="button" data-step="${i}"${can(i) ? "" : " disabled"}${i === idx ? ' aria-current="step"' : ""}>${n}</button></li>`).join("");
  $("#steps").querySelectorAll("[data-step]").forEach((b) => b.onclick = () => {
    const i = Number(b.dataset.step);
    if (i === 0) state.stage = "start";
    else if (i <= 4) { state.stage = "sort"; state.round = i - 1; }
    else if (i === 5) state.stage = "map";
    else if (i === 6) state.stage = "quiz";
    else if (i === 7) state.stage = "explain";
    else state.stage = "finish";
    shownBack.clear(); showHints = false; selected = null; save(); render(); window.scrollTo(0, 0);
  });
}

function renderFactory() {
  const lit = new Set(state.lit);
  const done = new Set();
  for (let r = 0; r < ROUNDS.length; r++) {
    const complete = ROUNDS[r].slots.every((s) => state.locked[s.id]);
    if (!complete) continue;
    ROUNDS[r].slots.forEach((s) => { const c = CARD[s.answer]; c.made.forEach((e) => done.add(e)); if (r === 0) c.present.forEach((e) => done.add(e)); });
  }
  $("#factory").innerHTML = DATA.ladder.map(([s, z]) => {
    const on = done.has(s);
    const flash = on && !lit.has(s);
    if (on) lit.add(s);
    return `<div class="el ${on ? "made" : ""} ${flash ? "lit" : ""}" aria-label="${s}${on ? ", made" : ", not yet"}"><small>${z}</small><b>${s}</b></div>`;
  }).join("");
  state.lit = [...lit];
}

function render() {
  renderSteps();
  renderFactory();
  const app = $("#app");
  if (state.stage === "start") return renderStart(app);
  if (state.stage === "sort") return renderSort(app);
  if (state.stage === "map") return renderMap(app);
  if (state.stage === "quiz") return renderQuiz(app);
  if (state.stage === "explain") return renderExplain(app);
  return renderFinish(app);
}

function renderStart(app) {
  app.innerHTML = `<section class="panel"><h2>Where do elements come from?</h2>
    <p class="lead">You will put a star's life in order, one path at a time, and track the elements each stage makes.</p>
    <label class="field" for="nm">Your name</label><input type="text" id="nm" autocomplete="name" value="${esc(state.name)}">
    <label class="field" for="pd">Class period</label><input type="text" id="pd" value="${esc(state.period)}" style="max-width:160px">
    <p class="err" id="startErr" role="alert"></p>
    <p><b>Step 1.</b> Watch the video first (2 min 27 s): <a href="${CONFIG.videoUrl}" target="_blank" rel="noopener">The Origin of Heavy Elements</a>. If it doesn't open, try the <a href="${CONFIG.backupVideoUrl}" target="_blank" rel="noopener">backup link</a>.</p>
    <p><b>Step 2.</b> Sort the cards. Drag a card by its title into a box, or tap <b>Select</b> on a card and then tap a box. Changed your mind? Tap the &times; on a placed card to take it back out.</p>
    <div class="bar"><button class="primary" id="go">Start sorting</button></div>
    <div class="glossary" id="gloss"></div></section>`;
  renderGlossary();
  const clr = () => { $("#startErr").textContent = ""; };
  $("#nm").addEventListener("input", clr); $("#pd").addEventListener("input", clr);
  $("#go").onclick = () => {
    const n = $("#nm").value.trim(), p = $("#pd").value.trim();
    if (!n) { $("#startErr").textContent = "Enter your name first."; $("#nm").focus(); return; }
    if (!p) { $("#startErr").textContent = "Enter your class period first."; $("#pd").focus(); return; }
    state.name = n; state.period = p; state.stage = "sort"; state.round = 0; save(); render();
  };
}

function renderGlossary() {
  const l = $("#lang").value, g = $("#gloss");
  if (!g) return;
  if (!l) { g.innerHTML = ""; return; }
  const col = { es: 1, zh: 2, ar: 3 }[l];
  g.innerHTML = `<p><b>Key words</b></p><table>${DATA.glossary.map((r) => `<tr><td>${esc(r[0])}</td><td lang="${l === "zh" ? "zh-Hant" : l}"${l === "ar" ? ' dir="rtl"' : ""}>${esc(r[col])}</td></tr>`).join("")}</table>`;
}

function trayCards(r) {
  const used = new Set(Object.values(state.place).map(Number));
  return ROUNDS[r].order.filter((id) => !used.has(id)).map((id) => CARD[id]);
}

function renderSort(app) {
  const R = ROUNDS[state.round];
  const done = R.slots.every((s) => state.locked[s.id]);
  const rows = {};
  R.slots.forEach((s) => { (rows[s.row] = rows[s.row] || []).push(s); });
  const board = Object.entries(rows).map(([row, slots]) => `<div class="row"><div class="row-label">${esc(row)}</div><div class="slots">${slots.map((s) => {
    const cid = state.place[s.id]; const c = cid ? CARD[cid] : null;
    const cls = state.locked[s.id] ? "ok" : selected && !cid ? "ready" : "";
    return `<div class="slot ${cls}" data-slot="${s.id}" tabindex="0" role="button" aria-label="${esc(s.cap)}${c ? ": " + esc(c.name) : ", empty"}"><div class="cap">${esc(s.cap)}</div>${c ? `<div class="mini" data-mini="${c.id}" data-from="${s.id}"><b>${esc(c.name)}</b>${trName(c)}${state.locked[s.id] ? "" : `<button type="button" class="remove" data-remove="${s.id}" aria-label="Take ${esc(c.name)} out of this box" title="Take it back out">&times;</button>`}</div>` : ""}</div>`;
  }).join("")}</div></div>`).join("");
  const tray = done ? R.slots.map((s) => CARD[s.answer]) : trayCards(state.round);
  app.innerHTML = `<section class="panel"><h2>${esc(R.title)}</h2><p class="lead">${esc(R.intro)}</p>
    <div class="layout"><div class="board">${board}
      <div class="bar"><button class="primary" id="check"${done ? " hidden" : ""}>${state.round === 0 ? "Check my order" : "Check my card placement"}</button>
      <button id="hint"${done ? " hidden" : ""}>Get a hint</button>
      <button class="primary" id="next"${done ? "" : " hidden"}>${state.round < ROUNDS.length - 1 ? "Next round" : "See the whole life cycle"}</button>
      ${allDone() && state.round < ROUNDS.length - 1 ? '<button id="toq">Back to the questions</button>' : ""}</div>
      <p class="msg" id="msg" role="status"></p><ul class="feedback" id="fb"></ul><div class="glossary" id="gloss"></div></div>
    <div>${done ? '<p class="review-note">The cards from this round, in order. Flip them to see the element factory.</p>' : ""}<div class="tray" id="tray">${tray.length ? tray.map((c) => cardHTML(c, state.round, done)).join("") : `<p class="tray-empty">All cards are placed. ${state.round === 0 ? "Check your order." : "Check your card placement."}</p>`}</div></div></div></section>`;
  renderGlossary();
  if (done) { $("#msg").className = "msg ok"; $("#msg").textContent = R.doneMsg; }
  wireSort();
}

function placeInto(slotId, cid) {
  if (state.locked[slotId]) return;
  for (const k of Object.keys(state.place)) if (Number(state.place[k]) === cid && !state.locked[k]) delete state.place[k];
  const prev = state.place[slotId];
  state.place[slotId] = cid;
  selected = null;
  save(); render();
  if (prev) setMsg("", "");
}

function setMsg(t, cls) { const m = $("#msg"); if (m) { m.textContent = t; m.className = "msg " + cls; } }

function wireSort() {
  const app = $("#app");
  app.querySelectorAll("[data-flip]").forEach((b) => b.onclick = (e) => {
    e.stopPropagation(); const id = Number(b.dataset.flip);
    if (shownBack.has(id)) shownBack.delete(id); else { shownBack.add(id); state.flips++; save(); }
    render(); const el = $(`[data-flip="${id}"]`); if (el) el.focus();
  });
  app.querySelectorAll("[data-select]").forEach((b) => b.onclick = (e) => {
    e.stopPropagation(); const id = Number(b.dataset.select); selected = selected === id ? null : id; render();
    const first = $(".slot.ready"); if (first) first.focus();
  });
  app.querySelectorAll(".card").forEach((el) => {
    el.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target === el) { e.preventDefault(); selected = Number(el.dataset.id); render(); const s = $(".slot.ready"); if (s) s.focus(); } });
    el.addEventListener("pointerdown", (e) => { if (e.pointerType === "mouse" || e.target.closest(".handle")) beginDrag(e, Number(el.dataset.id), null, el); });
  });
  app.querySelectorAll(".slot").forEach((el) => {
    const sid = el.dataset.slot;
    const act = () => { if (!state.locked[sid] && selected) placeInto(sid, selected); };
    el.onclick = (e) => { if (!e.target.closest(".remove")) act(); };
    el.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target === el) { e.preventDefault(); act(); } });
  });
  app.querySelectorAll("[data-remove]").forEach((b) => b.onclick = (e) => {
    e.stopPropagation(); const sid = b.dataset.remove;
    if (state.locked[sid]) return;
    delete state.place[sid]; save(); render(); setMsg("Card taken back out.", "");
  });
  app.querySelectorAll(".mini[data-mini]").forEach((m) => {
    if (state.locked[m.dataset.from]) return;
    m.addEventListener("pointerdown", (e) => beginDrag(e, Number(m.dataset.mini), m.dataset.from, m));
  });
  const chk = $("#check"); if (chk) chk.onclick = checkRound;
  const tq = $("#toq"); if (tq) tq.onclick = () => { shownBack.clear(); showHints = false; state.stage = state.mcChecked ? "explain" : "quiz"; save(); render(); window.scrollTo(0, 0); };
  const h = $("#hint"); if (h) h.onclick = giveHint;
  const nx = $("#next"); if (nx) nx.onclick = () => {
    shownBack.clear(); showHints = false; selected = null;
    if (state.round < ROUNDS.length - 1) state.round++; else state.stage = "map";
    save(); render(); window.scrollTo(0, 0);
  };
}

let drag = null;
function beginDrag(e, cid, fromSlot, src) {
  if (e.button !== 0 || e.target.closest("button") || state.stage !== "sort" || roundDone(state.round)) return;
  drag = { cid, fromSlot, src, x0: e.clientX, y0: e.clientY, on: false, over: null, ghost: null };
  document.addEventListener("pointermove", moveDrag, { passive: false });
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", cleanupDrag);
}
function moveDrag(e) {
  if (!drag) return;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    drag.on = true;
    const g = document.createElement("div");
    g.className = "ghost";
    g.textContent = CARD[drag.cid].name;
    document.body.appendChild(g);
    drag.ghost = g;
    drag.src.classList.add("dragsrc");
    document.body.classList.add("dragging");
  }
  e.preventDefault();
  drag.ghost.style.transform = `translate(${e.clientX + 14}px, ${e.clientY + 12}px)`;
  const hit = document.elementFromPoint(e.clientX, e.clientY);
  const slot = hit && hit.closest(".slot");
  const sid = slot && !state.locked[slot.dataset.slot] ? slot.dataset.slot : null;
  if (sid !== drag.over) {
    document.querySelectorAll(".slot.over").forEach((s) => s.classList.remove("over"));
    if (sid) slot.classList.add("over");
    drag.over = sid;
  }
  const edge = 45;
  if (e.clientY < edge) window.scrollBy(0, -14); else if (e.clientY > innerHeight - edge) window.scrollBy(0, 14);
}
function endDrag(e) {
  const d = drag;
  cleanupDrag();
  if (!d || !d.on) return;
  if (d.over) { placeInto(d.over, d.cid); return; }
  if (d.fromSlot) {
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    if (hit && hit.closest("#tray")) { delete state.place[d.fromSlot]; save(); render(); }
  }
}
function cleanupDrag() {
  document.removeEventListener("pointermove", moveDrag);
  document.removeEventListener("pointerup", endDrag);
  document.removeEventListener("pointercancel", cleanupDrag);
  if (drag) { if (drag.ghost) drag.ghost.remove(); if (drag.src) drag.src.classList.remove("dragsrc"); }
  document.body.classList.remove("dragging");
  document.querySelectorAll(".slot.over").forEach((s) => s.classList.remove("over"));
  drag = null;
}

function checkRound() {
  const R = ROUNDS[state.round];
  const empty = R.slots.filter((s) => !state.place[s.id]);
  if (empty.length) { setMsg(`Place a card in every box first (${empty.length} still empty).`, "bad"); return; }
  state.checks[state.round]++;
  const wrong = [];
  R.slots.forEach((s) => {
    if (Number(state.place[s.id]) === s.answer) state.locked[s.id] = true;
    else { wrong.push(CARD[state.place[s.id]]); delete state.place[s.id]; }
  });
  save(); render();
  if (!wrong.length) return;
  setMsg(`${R.slots.length - wrong.length} of ${R.slots.length} are right. The others went back to the cards.`, "bad");
  $("#fb").innerHTML = wrong.map((c) => `<li><b>${esc(c.name)}:</b> ${esc(c.hint)}</li>`).join("");
}

function giveHint() {
  const r = state.round, tier = state.hintTier[r];
  state.hints++;
  if (tier === 0) { setMsg("Hint: flip the cards. From card to card, the black boxes should move toward heavier elements, or stop.", ""); }
  else if (tier === 1) { showHints = true; render(); setMsg("Hint: each card now shows a clue about where it goes.", ""); }
  else {
    const R = ROUNDS[r]; const s = R.slots.find((x) => !state.locked[x.id]);
    if (s) {
      for (const k of Object.keys(state.place)) if (Number(state.place[k]) === s.answer) delete state.place[k];
      state.place[s.id] = s.answer; state.locked[s.id] = true;
      save(); render(); setMsg(`Hint: ${CARD[s.answer].name} is placed for you.`, "");
    }
  }
  state.hintTier[r] = Math.min(tier + 1, 2); save();
}

function renderExplain(app) {
  const Q = DATA.q;
  const block = (k) => `<label class="field" for="q_${k}">${esc(Q[k].ask)}</label>
    <p class="frame">${esc(Q[k].frame)}</p>
    <textarea id="q_${k}">${esc(state[k] || "")}</textarea><p class="err" id="e_${k}" role="alert"></p>`;
  app.innerHTML = `<section class="panel"><h2>Explain it</h2>
    <p class="lead">Answer in full sentences. You can use the sentence starters.</p>
    ${DATA.qorder.map(block).join("")}
    <h2 style="margin-top:18px">${esc(DATA.starsTask.label)}</h2><p class="lead">${esc(DATA.starsTask.text)}</p>
    <p class="hintline"><b>Key term.</b> Main sequence: ${esc(DATA.msDef)}</p>
    <div class="startable"><table><thead><tr><th>Star</th><th>Mass (x the Sun's)</th><th>What astronomers see now</th><th>Stage in life</th></tr></thead><tbody>
    ${DATA.stars.map((s) => `<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.mass)}</td><td>${esc(s.see)}</td><td><select data-star="${s.id}" aria-label="Stage in life for ${esc(s.name)}"><option value="">Choose a stage</option>${DATA.stageOptions.map((o) => `<option${(state.stars || {})[s.id] === o ? " selected" : ""}>${esc(o)}</option>`).join("")}</select></td></tr>`).join("")}
    </tbody></table></div>
    <label class="field" for="snStar">Which of these stars will one day explode as a supernova?</label>
    <select id="snStar"><option value="">Choose a star</option>${DATA.stars.map((s) => `<option${state.snStar === s.short ? " selected" : ""}>${esc(s.short)}</option>`).join("")}</select>
    <label class="field" for="snLeft">What will it most likely leave behind?</label>
    <select id="snLeft"><option value="">Choose one</option>${["White dwarf", "Neutron star", "Black hole", "Nothing"].map((o) => `<option${state.snLeft === o ? " selected" : ""}>${o}</option>`).join("")}</select>
    <p class="err" id="e_stars" role="alert"></p>
    <div class="bar"><button id="back">Back to the cards</button><button class="primary" id="fin">Finish</button></div>
    <div class="glossary" id="gloss"></div></section>`;
  renderGlossary();
  const sync = () => {
    DATA.qorder.forEach((k) => { state[k] = $("#q_" + k).value; });
    state.stars = state.stars || {};
    app.querySelectorAll("[data-star]").forEach((s) => { state.stars[s.dataset.star] = s.value; });
    state.snStar = $("#snStar").value; state.snLeft = $("#snLeft").value; save();
  };
  app.querySelectorAll("select").forEach((s) => s.addEventListener("change", () => { $("#e_stars").textContent = ""; sync(); }));
  DATA.qorder.forEach((k) => $("#q_" + k).addEventListener("input", () => { $("#e_" + k).textContent = ""; sync(); }));
  $("#back").onclick = () => { state.stage = "sort"; state.round = 0; save(); render(); window.scrollTo(0, 0); };
  $("#fin").onclick = () => {
    sync();
    const w = (t) => (t || "").trim().split(/\s+/).filter(Boolean).length;
    let first = null;
    DATA.qorder.forEach((k) => {
      if (w(state[k]) < Q[k].min) { $("#e_" + k).textContent = Q[k].err; if (!first) first = k; }
    });
    const missing = DATA.stars.filter((s) => !state.stars[s.id]).length + (state.snStar ? 0 : 1) + (state.snLeft ? 0 : 1);
    if (missing) { $("#e_stars").textContent = `Choose an answer in every box (${missing} still empty).`; if (!first) first = "stars"; }
    if (first) { (first === "stars" ? app.querySelector("[data-star]") : $("#q_" + first)).focus(); return; }
    state.stage = "finish"; state.finished = state.finished || Date.now(); save(); render(); window.scrollTo(0, 0);
  };
}

function mcResult(q) {
  const L = (state.mc || {})[q.id] || "";
  const i = "ABCD".indexOf(L);
  return L ? `${L}. ${q.options[i]} (${L === q.correct ? "correct" : "incorrect; answer is " + q.correct})` : "";
}
let mapPick = null;
function renderMap(app) {
  const M = DATA.map, W = 150, H = 56;

    const c = CARD[n.id], bonus = c.path === "bonus", picked = mapPick === n.id;
    const fill = { all: "#5b4fc4", sun: "#a85f00", massive: "#1f5fa3", ns: "#1f5fa3", bh: "#1f5fa3", recycle: "#4a5568", bonus: "#ffffff" }[c.path];
    const lines = n.lines.map((t, i) => `<tspan x="${n.x + W / 2}" dy="${i === 0 ? (n.lines.length === 1 ? 5 : -4) : 18}">${esc(t)}</tspan>`).join("");
    return `<g class="mapnode${picked ? " picked" : ""}" data-node="${n.id}" role="button" tabindex="0" aria-label="${esc(c.name)}. Show this card.">
      <rect x="${n.x}" y="${n.y}" width="${W}" height="${H}" rx="10" fill="${fill}" stroke="${bonus ? "#0d6e62" : picked ? "#ffd27a" : "none"}" stroke-width="${bonus || picked ? 3 : 0}"${bonus ? ' stroke-dasharray="6 4"' : ""}/>
      <text x="${n.x + W / 2}" y="${n.y + H / 2}" text-anchor="middle" font-size="15" font-weight="700" fill="${bonus ? "#0d6e62" : "#ffffff"}">${lines}</text></g>`;
  };
  const path = (d, dashed, color) => `<path d="${d}" fill="none" stroke="${color || "#16182b"}" stroke-width="2.2"${dashed ? ' stroke-dasharray="6 5"' : ""} marker-end="url(#mah${color ? "g" : ""})"/>`;
  const svg = `<svg viewBox="0 0 1140 668" class="mapsvg" role="img" aria-label="Map of the whole star life cycle">
    <defs><marker id="mah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16182b"/></marker>
    <marker id="mahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7085"/></marker></defs>
    ${M.labels.map((l) => `<text x="${l.x}" y="${l.y}" font-size="${l.size || 14}" font-weight="${l.bold ? 700 : 400}" fill="${l.color || "#555a70"}"${l.anchor ? ` text-anchor="${l.anchor}"` : ""}>${esc(l.t)}</text>`).join("")}
    ${M.edges.map((e) => path(e.d, e.dashed, e.gray ? "#6b7085" : null)).join("")}
    ${M.lines.map((d) => `<path d="${d}" fill="none" stroke="#6b7085" stroke-width="2.2" stroke-dasharray="6 5"/>`).join("")}
    ${M.nodes.map(node).join("")}</svg>`;
  const pick = mapPick ? CARD[mapPick] : null;
  app.innerHTML = `<section class="panel"><h2>The whole life cycle</h2>
    <p class="lead">All of your cards in one map. Click any stage to look at its card again.</p>
    <div class="mapwrap">${svg}</div>
    <div class="mapkey"><span><i class="sw" style="background:#5b4fc4"></i>All stars</span><span><i class="sw" style="background:#a85f00"></i>Stars like our Sun</span><span><i class="sw" style="background:#1f5fa3"></i>Massive stars</span><span><i class="sw sw-b"></i>Bonus: needs a close partner star</span><span><i class="sw sw-d"></i>Released into space</span></div>
    <div id="mapcard">${pick ? `<div class="tray" style="max-width:520px">${cardHTML(pick, null, true)}</div>` : ""}</div>
    <div class="bar"><button class="primary" id="mapnext">${state.mcChecked ? "Back to the questions" : "Go to the quick check"}</button></div>
    <div class="glossary" id="gloss"></div></section>`;
  renderGlossary();
  app.querySelectorAll(".mapnode").forEach((g) => {
    const go = () => { mapPick = Number(g.dataset.node); renderMap(app); const mc = $("#mapcard"); if (mc) mc.scrollIntoView({ block: "nearest" }); };
    g.addEventListener("click", go);
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
  app.querySelectorAll("[data-flip]").forEach((b) => b.onclick = () => {
    const id = Number(b.dataset.flip);
    if (shownBack.has(id)) shownBack.delete(id); else { shownBack.add(id); state.flips++; save(); }
    renderMap(app);
  });
  $("#mapnext").onclick = () => { mapPick = null; shownBack.clear(); state.stage = state.mcChecked ? "explain" : "quiz"; save(); render(); window.scrollTo(0, 0); };
}

function imgFail(img) {
  const list = JSON.parse(img.dataset.srcs || "[]"), i = Number(img.dataset.i) + 1;
  if (i < list.length) { img.dataset.i = i; img.src = list[i]; return; }
  const b = img.closest(".mcq-body"); if (b) b.classList.add("nofig");
  img.closest("figure").remove();
}
function renderQuiz(app) {
  const Q = DATA.mc;
  const chk = !!state.mcChecked;
  state.mc = state.mc || {};
  const figure = (q) => {
    const im = (CONFIG.quickCheckImages || {})[q.id] || {};
    const srcs = [].concat(im.src || []).filter(Boolean);
    if (srcs.length) return `<figure class="mcq-fig"><img src="${esc(srcs[0])}" data-srcs="${esc(JSON.stringify(srcs))}" data-i="0" alt="${esc(im.alt || q.title)}" onerror="imgFail(this)">${im.credit ? `<figcaption>${esc(im.credit)}</figcaption>` : ""}</figure>`;
    if (CONFIG.showImagePlaceholders) return `<figure class="mcq-fig"><div class="ph" role="img" aria-label="Picture space">Picture space: ${esc(im.alt || q.title)}</div></figure>`;
    return "";
  };
  app.innerHTML = `<section class="panel"><h2>Quick check</h2>
    <p class="lead">Use the data to choose the best answer. You check your answers once, then you see the correct ones.</p>
    ${Q.map((q, i) => {
      const fig = figure(q);
      return `<article class="mcq">
      <div class="mcq-head"><span class="qnum" aria-hidden="true">${i + 1}</span><h3>${esc(q.title)}</h3></div>
      <div class="mcq-body${fig ? "" : " nofig"}">${fig}
        <dl class="facts">${q.data.map(([k, v]) => `<div class="fact"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
      </div>
      <fieldset class="choices"><legend>${i + 1}. ${esc(q.ask)}</legend>
        <div class="optgrid">${q.options.map((o, j) => {
          const L = "ABCD"[j], picked = state.mc[q.id] === L;
          const cls = chk ? (L === q.correct ? "right" : picked ? "wrong" : "") : "";
          return `<label class="opt ${cls}"><input type="radio" name="${q.id}" value="${L}"${picked ? " checked" : ""}${chk ? " disabled" : ""}><span><b>${L}.</b> ${esc(o)}</span></label>`;
        }).join("")}</div>
      </fieldset>
      ${chk ? `<div class="mcq-fb ${state.mc[q.id] === q.correct ? "ok" : "bad"}"><p class="msg ${state.mc[q.id] === q.correct ? "ok" : "bad"}">${state.mc[q.id] === q.correct ? "Correct." : "Not quite. The answer is " + q.correct + "."}</p><p>${esc(q.why)}</p></div>` : ""}
    </article>`;
    }).join("")}
    <p class="err" id="e_mc" role="alert"></p>
    <div class="bar">${chk ? '<button class="primary" id="toexplain">Go to the written questions</button>' : '<button class="primary" id="mccheck">Check my answers</button>'}</div>
    <div class="glossary" id="gloss"></div></section>`;
  renderGlossary();
  app.querySelectorAll('input[type="radio"]').forEach((r) => r.onchange = () => { state.mc[r.name] = r.value; $("#e_mc").textContent = ""; save(); });
  const c = $("#mccheck");
  if (c) c.onclick = () => {
    const missing = Q.filter((q) => !state.mc[q.id]).length;
    if (missing) { $("#e_mc").textContent = `Answer every question first (${missing} left).`; return; }
    state.mcChecked = true; save(); render();
  };
  const t = $("#toexplain");
  if (t) t.onclick = () => { state.stage = "explain"; save(); render(); window.scrollTo(0, 0); };
}

function results() {
  const mins = Math.max(1, Math.round(((state.finished || Date.now()) - state.started) / 60000));
  const right = DATA.stars.filter((s) => s.answer.includes((state.stars || {})[s.id])).length;
  return `Rounds done: 4 of 4 | Checks used: Round 1 ${state.checks[0]}, Round 2 ${state.checks[1]}, Round 3 ${state.checks[2]}, Bonus ${state.checks[3]} | Hints used: ${state.hints} | Cards flipped: ${state.flips} | Time: about ${mins} min | Quick check: ${DATA.mc.filter((q) => (state.mc || {})[q.id] === q.correct).length} of ${DATA.mc.length} | Stars on the right card: ${right} of ${DATA.stars.length} | Future supernova: ${state.snStar} | Left behind: ${state.snLeft}`;
}

function renderFinish(app) {
  const res = results();
  const full = `Name: ${state.name}\nPeriod: ${state.period}\n${res}` + "\n\nQuick check:\n" + DATA.mc.map((q, i) => `${i + 1}. ${mcResult(q)}`).join("\n") + DATA.qorder.map((k) => `\n\n${DATA.q[k].ask}\n${state[k] || ""}`).join("") + "\n\nStars you already know:\n" + DATA.stars.map((s) => `${s.name}: ${(state.stars || {})[s.id] || ""}`).join("\n");
  const hasForm = CONFIG.formPrefillUrl && CONFIG.formPrefillUrl.includes("STUDENTNAME");
  app.innerHTML = `<section class="panel"><h2>You finished, ${esc(state.name)}</h2>
    <p class="lead">Your star sorted all the way from a cloud of gas to gold. Now send your work to ${esc(CONFIG.teacherName)}.</p>
    <div class="summary" id="sum">${esc(full)}</div>
    <div class="bar">${hasForm ? '<button class="primary" id="send">Send to my teacher</button>' : ""}
      <button id="copy">Copy my work</button><button id="restart">Start over</button></div>
    <p class="msg" id="msg" role="status">${hasForm ? "Send to my teacher opens a form with your work filled in. Press Submit on the form." : "Copy your work and paste it into your Google Classroom assignment."}</p></section>
    <section class="panel"><h2>Want to go further? (optional)</h2>
    <p>Scientists are still working out where all of the universe's gold came from. Neutron stars colliding make gold, but they may not happen often or early enough to explain all of it.</p>
    <p>Read: <a href="${DATA.reading.url}" target="_blank" rel="noopener">${esc(DATA.reading.title)}</a> (${esc(DATA.reading.source)})</p></section>`;
  if (hasForm) $("#send").onclick = () => {
    const enc = encodeURIComponent;
    const url = CONFIG.formPrefillUrl.replace("STUDENTNAME", enc(state.name)).replace("CLASSPERIOD", enc(state.period))
      .replace("RESULTS", enc(res)).replace("MC1ANSWER", enc(mcResult(DATA.mc[0]))).replace("MC2ANSWER", enc(mcResult(DATA.mc[1]))).replace("MC3ANSWER", enc(mcResult(DATA.mc[2]))).replace("IRONANSWER", enc(state.iron || "")).replace("CARBONANSWER", enc(state.carbon || "")).replace("GOLDANSWER", enc(state.gold || ""));
    window.open(url, "_blank", "noopener");
  };
  $("#copy").onclick = async () => {
    try { await navigator.clipboard.writeText(full); setMsg("Copied. Paste it into your Google Classroom assignment.", "ok"); }
    catch (e) { const r = document.createRange(); r.selectNodeContents($("#sum")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); setMsg("Your work is highlighted. Press Ctrl+C to copy it.", "ok"); }
  };
  $("#restart").onclick = () => {
    if (!confirm("Start over? Your sorting and answers will be cleared.")) return;
    state = fresh(); shownBack.clear(); selected = null; save(); render();
  };
}

$("#lang").addEventListener("change", () => { try { localStorage.setItem(KEY + "-lang", $("#lang").value); } catch (e) {} render(); });
try { const l = localStorage.getItem(KEY + "-lang"); if (l !== null) $("#lang").value = l; } catch (e) {}
$("#ver").textContent = "Version: " + VERSION;
render();
</script>
</body>
</html>
